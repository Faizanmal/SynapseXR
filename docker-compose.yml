services:
  # Python FastAPI Multi-Agent AI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsexr-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ENVIRONMENT=production
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - RATE_LIMIT_EXECUTE_PER_MIN=${RATE_LIMIT_EXECUTE_PER_MIN:-20}
      - RATE_LIMIT_DEFAULT_PER_MIN=${RATE_LIMIT_DEFAULT_PER_MIN:-120}
      - TRUST_PROXY_HEADERS=true
      - ALLOWED_ORIGINS=http://localhost,https://localhost,http://localhost:8081,https://localhost:8081,http://${PUBLIC_DOMAIN:-localhost},https://${PUBLIC_DOMAIN:-localhost}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - synapsexr-net

  # Production WebXR Spatial Frontend + Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapsexr-frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synapsexr-net

networks:
  synapsexr-net:
    driver: bridge
