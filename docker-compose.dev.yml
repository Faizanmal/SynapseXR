services:
  # Python FastAPI Backend (Development mode with auto-reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsexr-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./backend/app:/srv/app
    ports:
      - "8000:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ALLOWED_ORIGINS=http://localhost:8081,https://localhost:8081,http://localhost:80,http://localhost
