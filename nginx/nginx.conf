user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimize for modern web delivery
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for 3D bundles, WASM, and JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm
        model/gltf-binary
        model/gltf+json;



    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Docker embedded DNS resolver (prevents Nginx from failing at boot if backend is initializing)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # WebXR client SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Reverse Proxy /api to FastAPI backend
        location /api/ {
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # Reverse Proxy /health check
        location /health {
            proxy_pass $backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static assets caching (3D GLB models, sounds, WASM, icons)
        location ~* \.(?:css|js|glb|gltf|png|jpg|jpeg|gif|ico|svg|wasm|mp3|uikitml)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin *;
        }
    }
}
